[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-persona-server"
dynamic = ["version"]
description = "simple flask server to host OpenVoiceOS persona plugins as a service"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "JarbasAi", email = "jarbasai@mailfence.com"}]
requires-python = ">=3.9"

keywords = [
    "plugin",
    "lang",
    "detect",
    "translate",
    "OVOS",
    "OpenVoiceOS",
]
dependencies = [
    "fastapi",
    "ovos-persona",
    "ovos-workshop",
    "pydantic",
    "uvicorn",
]

[project.optional-dependencies]
a2a = ["a2a-sdk>=0.3.0", "httpx>=0.27"]
dev = ["pytest>=7.0", "pytest-asyncio", "pytest-cov", "httpx", "anthropic"]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-persona-server"
Repository = "https://github.com/OpenVoiceOS/ovos-persona-server"

[project.scripts]
ovos-persona-server = "ovos_persona_server.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ovos_persona_server*"]

[tool.setuptools.dynamic]
version = {attr = "ovos_persona_server.version.__version__"}
