[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-persona-server"
dynamic = ["version"]
description = "simple flask server to host OpenVoiceOS persona plugins as a service"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "JarbasAi", email = "jarbasai@mailfence.com"}]
requires-python = ">=3.9"

keywords = [
    "plugin",
    "lang",
    "detect",
    "translate",
    "OVOS",
    "OpenVoiceOS",
]
dependencies = [
    "fastapi>=0.115",
    "ovos-persona>=0.9.0a6",  # memory plugin receives persona config (feat/memory-plugin-config)
    "ovos-plugin-manager>=2.11.1a1",  # tool-call contract (ToolCall, MessageRole.TOOL) + AGENT_TOOLBOX config kwarg
    "ovos-workshop",
    "pydantic",
    "uvicorn>=0.34",
    "aiosqlite",
    "sqlalchemy[asyncio]>=2.0",  # [asyncio] pulls greenlet, required by AsyncSession
    "python-dotenv",
    "python-multipart",
]

[project.optional-dependencies]
# httpx<1: a2a-sdk 1.2.3 uses httpx.AsyncClient, which the httpx 1.0 prereleases do not have.
a2a = ["a2a-sdk[http-server]>=1.2.3", "httpx<1"]
mcp = ["fastmcp>=4.1.1"]
# Plugins powering vector-store search (chunking + reranking + embeddings)
# httpx<1: chromadb, behind the vector store, uses httpx.Limits, which the httpx 1.0 prereleases do not have.
rag = ["ovos-document-chunkers", "ovos-flashrank-reranker-plugin", "httpx<1"]
# Full deploy-realistic stack for the cross-plugin e2e suite (tests/e2e). Must be the
# UNION of everything tests/e2e imports so no test silently skips: real gguf embeddings,
# real vector DBs, chunking/reranking, a deterministic solver, every vendor client SDK,
# and the MCP runtime.
e2e = [
    # client SDKs exercised by the vendor e2e tests (must all be present)
    "openai",
    "ollama",
    "cohere",
    "google-genai",
    "boto3",
    "anthropic",
    "huggingface_hub",
    "fastmcp>=4.1.1",
    "mcp>=2.3.0",
    "utcp>=1.2.0",
    "utcp-http>=1.1.14",
    "uvicorn",
    "httpx",
    # real embedding + vector-store + RAG plugin stack
    "ovos-openai-plugin>=2.0.11a1",  # PersonaServerRAGMemory reads content-parts search hits
    "ovos-gguf-plugin",
    "ovos-chromadb-embeddings-plugin>=0.3.0a4",  # collection-aware EmbeddingsDB API
    "ovos-qdrant-embeddings-plugin",
    "ovos-document-chunkers",
    "ovos-flashrank-reranker-plugin",
    "ovos-solver-failure-plugin",
]
# Everything the unit suite under tests/ imports. The compat routers are tested
# against each vendor's own client, so those SDKs belong here, and the a2a and
# mcp tests are async.
test = [
    "pytest>=7.0",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "uvicorn",
    "openai",
    "ollama",
    "cohere",
    "google-genai",
    "boto3",
    "anthropic",
    "huggingface_hub",
    "fastmcp>=4.1.1",
    "mcp>=2.3.0",
    "utcp>=1.2.0",
    "utcp-http>=1.1.14",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-persona-server"
Repository = "https://github.com/OpenVoiceOS/ovos-persona-server"

[project.scripts]
ovos-persona-server = "ovos_persona_server.__main__:main"
ovos-persona-tools-mcp = "ovos_persona_tools_mcp:main"

[tool.setuptools]
include-package-data = true
py-modules = ["ovos_persona_tools_mcp"]

[tool.setuptools.packages.find]
include = ["ovos_persona_server*"]

[tool.setuptools.dynamic]
version = {attr = "ovos_persona_server.version.__version__"}
