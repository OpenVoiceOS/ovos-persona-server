name: End-to-End Tests
# Deploy-realistic cross-plugin RAG tests.
#
# Unlike the unit matrix (build_tests.yml), this installs the FULL real stack the
# way a user would deploy it and runs tests/e2e for real — no dependency overrides:
#   - text embeddings: ovos-gguf-embeddings-plugin (downloads all-MiniLM-L6-v2)
#   - vector DBs:       ovos-chromadb-embeddings-plugin + ovos-qdrant-embeddings-plugin
#   - chat solver:      ovos-solver-openai-plugin (upstream LLM call mocked in-test)
#   - RAG client:       ovos-openai-plugin OpenAIRAGSolver
#
# The companion RAG solver lives on the ovos-openai-plugin `rag` branch (PR #37),
# pulled via pre_install_pip until it is released.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
jobs:
  e2e:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    secrets: inherit
    with:
      # e2e is heavy (model download + native deps); a single modern Python is enough.
      python_versions: '["3.11"]'
      install_extras: "e2e"
      # Released and pinned in pyproject: the tool-call contract (MessageRole.TOOL,
      # ToolCall) in ovos-plugin-manager>=2.7.0a1, and memory-plugin config passing in
      # ovos-persona>=0.9.0a6. Still unreleased, installed here so the [e2e] extra is
      # satisfied by them:
      #  - PersonaServerRAGMemory lives on the ovos-openai-plugin `opm-agents` branch (PR #54)
      #  - ovos-chromadb-embeddings-plugin only has a 0.0.0 placeholder on PyPI; the
      #    collection-aware API needed here lives on `dev`
      pre_install_pip: "git+https://github.com/OpenVoiceOS/ovos-openai-plugin@opm-agents git+https://github.com/OpenVoiceOS/ovos-chromadb-embeddings-plugin@dev"
      test_path: "tests/e2e"
      pr_comment: true
