name: Build Tests
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
jobs:
  build_tests:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    secrets: inherit
    with:
      install_extras: "dev,mcp"
      # the OpenAI chat surface now honors `tools` (imports the tool contract:
      # ToolCall, MessageRole.TOOL); install the plugin-manager branch until it releases.
      pre_install_pip: "git+https://github.com/OpenVoiceOS/ovos-plugin-manager@feat/agent-tool-calling"
      # e2e tests need heavy real plugins (gguf model download, chromadb/qdrant)
      # and run in their own workflow (e2e.yml); keep the unit matrix fast here.
      test_path: "tests --ignore=tests/e2e"
